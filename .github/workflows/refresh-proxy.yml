name: refresh-featured-proxy
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Refresh channel feed
        run: python3 refresh_channel.py
      - name: Commit feed if it changed
        run: |
          git config user.name "goida-refresh"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/channel-feed.json
          git diff --cached --quiet && echo "no feed change" && exit 0
          git commit -m "refresh channel feed"
          git push
