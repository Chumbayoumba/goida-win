name: refresh-featured-proxy
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Probe slot and replace if dead
        run: python3 refresh.py --slot data/proxy.json --html index.html --candidates data/fallbacks.json --timeout 5
      - name: Commit slot if it changed
        run: |
          git config user.name "goida-refresh"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/proxy.json index.html
          git diff --cached --quiet && echo "no slot change" && exit 0
          git commit -m "refresh featured proxy slot"
          git push
