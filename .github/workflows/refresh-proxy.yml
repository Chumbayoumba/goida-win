name: refresh-featured-proxy
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Refresh channel feed locally in the job
        run: python3 refresh_channel.py
      # Do not commit from Actions. github-actions[bot] would show up
      # in Contributors. Push feed updates as Chumbayoumba only.
